# /etc/nginx/sites-available/koita-api
# Public HTTPS front door. certbot adds the 443/SSL lines and the http->https redirect.

# max 10 token requests per minute per IP: stops secret guessing
limit_req_zone $binary_remote_addr zone=koita_token:1m rate=10r/m;

server {
    listen 80;
    server_name api.vigyanshaala.in;

    location = /getToken {
        limit_req zone=koita_token burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location = /getdata {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
    }

    location / {
        return 404;
    }
}
